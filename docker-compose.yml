services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wedding_guest_planner
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - wedding_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_guest_planner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wedding_postgres_data:
